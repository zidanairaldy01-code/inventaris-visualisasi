# Railway Nixpacks Configuration for Laravel
# Forces Railway to use start.sh for proper environment variable loading

[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader']

[phases.build]
cmds = ['chmod +x start.sh']

[start]
cmd = './start.sh'
